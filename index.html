<!DOCTYPE html>
<html>

<head>
  <title>Recipe Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico">
</head>

<body>

  <header>
    <a href="index.html" class="header-text">Recipe Generator</a>
  </header>

  <main>

    <div class="card border shadow">
      <h2>What do you want to cook? 🍳</h2>
      <p>Type the name of a food and get a recipe for it.</p>
    </div>

    <form id="recipe-form">
      <input id="food" type="text" placeholder="e.g. Paneer butter masala" required>
      <button id="generate" type="submit">Generate recipe</button>
    </form>

    <div id="recipe" hidden></div>

  </main>

  <footer>
    Made with <span class="heart">&hearts;</span> by me
  </footer>

</body>

</html>
